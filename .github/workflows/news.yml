name: Daily News Push

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: "仅测试 PushPlus，不抓取新闻"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: daily-news-push
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10          # 放宽，配合代码并发后 10 分钟足够

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Send test message
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_mode }}
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python news.py --test

      - name: Fetch and push news
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.test_mode) }}
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          # 以下变量需 news.py 支持读取，见下方代码补丁
          MAX_NEWS: "15"
          FRESH_HOURS: "36"
          # 可选：启用/禁用 Google 新闻源（网络受限环境建议 0）
          ENABLE_GOOGLE_NEWS: "1"
          # 可选：原文摘要补全的最大条数，控制耗时
          ENRICH_LIMIT: "6"
          ENRICH_TIMEOUT: "90"
        run: python news.py

      - name: Notify failure
        if: ${{ failure() }}
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          python - <<'PY'
          import os, requests
          token = os.getenv("PUSHPLUS_TOKEN", "").strip()
          if not token:
              raise SystemExit(0)
          requests.post(
              "https://www.pushplus.plus/send",
              json={
                  "token": token,
                  "title": "⚠️ 新闻推送任务失败",
                  "content": "本次新闻抓取/推送失败，请查看 GitHub Actions 日志。",
                  "template": "html",
              },
              timeout=15,
          )
          PY